services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsh_reporting
      POSTGRES_USER: dsh
      POSTGRES_PASSWORD: dsh
    ports:
      - "5432:5432"
    volumes:
      - dsh-session-reporting-postgres:/var/lib/postgresql/data

volumes:
  dsh-session-reporting-postgres:
